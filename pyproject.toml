[build-system]
requires = ["uv_build>=0.9.13,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tailor"
module-root = ""

[project]
name = "tailor"
version = "0.2.0"
description = "Tailor your resume for each job application"
authors = [{ name = "Orest Tokovenko", email = "hi@oresttokovenko.com" }]
requires-python = ">=3.13,<3.14"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.8,<9",
]

[dependency-groups]
dev = [
    "pyrefly>=0.43.1",
    "pytest>=8.3",
    "ruff>=0.14.6",
]

[project.scripts]
tailor = "tailor:main.cli"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = [
    # f-strings in logging are fine for a CLI of this size
    "G004",
    # trailing commas hurt readability in short lists
    "COM812",
    # docstring summary lines don't need terminal punctuation
    "D415",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    # assert is the standard test mechanism
    "S101",
    # module/package docstrings in test files are noise
    "D100",
    "D104",
]
"tailor/__init__.py" = ["D104"]
"tailor/main.py" = [
    # bool params come from Click decorators, not caller code
    "FBT001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.pyproject-fmt]
column_width = 120
indent = 4

[tool.pyrefly]
search_path = ["tailor"]
python_version = "3.13"
untyped_def_behavior = "check-and-infer-return-type"
ignore_errors_in_generated_code = false
project_excludes = ["tests"]
